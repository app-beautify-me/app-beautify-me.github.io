title: "Beautify.me Blog"
description: "Notes and updates from Beautify.me."
url: "https://app-beautify-me.github.io"
baseurl: ""
repository: "app-beautify-me/app-beautify-me.github.io"
locale: "en-US"
timezone: "America/Los_Angeles"

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"
markdown: kramdown

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-feed

permalink: /:title/
paginate: 5
paginate_path: /page:num/
words_per_minute: 200

include:
  - _pages

exclude:
  - README.md
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE.minimal-mistakes
  - vendor
  - .bundle
  - .vscode

search: false
show_taxonomy: false
comments:
  provider: false
analytics:
  provider: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
